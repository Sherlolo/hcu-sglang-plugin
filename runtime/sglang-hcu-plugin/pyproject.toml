[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang-hcu-plugin"
version = "0.1.0"
description = "HCU capability plugin for SGLang: hooks for HCU-specific behavior on top of the adapter layer."
requires-python = ">=3.10"

[project.entry-points."sglang.srt.plugins"]
hcu_plugin = "sglang_hcu_plugin:register"

[tool.setuptools.packages.find]
where = ["src"]
